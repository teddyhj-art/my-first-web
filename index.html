
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래를 그리다 | Drawing with Music</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#f0eff9;--surface3:#e4e3f0;--accent:#ff8906;--accent2:#e53170;--accent3:#3da9fc;--green:#2ec4b6;--purple:#a78bfa;--text:#0f0e17;--text-muted:#6e6d85;--border:rgba(0,0,0,0.08);--radius:16px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Noto Sans Thai','Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{position:sticky;top:0;z-index:200;background:rgba(245,244,240,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{font-family:'Gowun Batang',serif;font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.lang-switcher{display:flex;gap:6px;flex-shrink:0}
.lang-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.78rem;cursor:pointer;transition:all .2s;font-family:inherit}
.lang-btn.active,.lang-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* STUDENT INFO */
.student-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px}
.student-bar-inner{max-width:900px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.info-field{flex:1;min-width:90px}
.info-field label{display:block;font-size:.7rem;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.info-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s}
.info-field input:focus{border-color:var(--accent)}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:28px 24px 80px;position:relative}

/* HERO */
.hero{text-align:center;padding:36px 0 28px}
.hero-emoji{font-size:3rem;display:block;margin-bottom:10px}
.hero-title{font-family:'Gowun Batang',serif;font-size:2rem;font-weight:700;line-height:1.3;margin-bottom:10px}
.hero-title span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-desc{color:var(--text-muted);font-size:.92rem;line-height:1.7;max-width:480px;margin:0 auto}

/* STEP CARD */
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;transition:box-shadow .3s}
.step-card:hover{box-shadow:0 6px 32px rgba(0,0,0,0.04)}
.step-header{display:flex;align-items:center;gap:14px;padding:16px 22px;user-select:none;border-bottom:1px solid var(--border)}
.step-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0;color:#fff}
.s1{background:linear-gradient(135deg,#ff8906,#e53170)}
.s2{background:linear-gradient(135deg,#3da9fc,#6c63ff)}
.step-title-wrap{flex:1}
.step-title{font-size:.98rem;font-weight:600;margin-bottom:2px}
.step-sub{font-size:.73rem;color:var(--text-muted)}

/* STEP CONTENT */
.step-content{padding:22px;background:var(--surface)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.85rem;font-weight:500;margin-bottom:8px;color:var(--text)}
.form-group input, .form-group textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.form-group input:focus, .form-group textarea:focus{border-color:var(--accent3)}
.form-group textarea{resize:vertical;min-height:140px;line-height:1.6}

/* BUTTON */
.btn-submit{display:block;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:30px;padding:14px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(229,49,112,0.2);transition:all .2s}
.btn-submit:hover{opacity:0.95;transform:translateY(-1px)}
</style>
</head>
<body>

  <header class="header">
    <div class="header-title">노래를 그리다</div>
    <div class="lang-switcher">
      <button class="lang-btn active">KO</button>
      <button class="lang-btn">EN</button>
    </div>
  </header>

  <div class="student-bar">
    <div class="student-bar-inner">
      <div class="info-field">
        <label>학년 / 반</label>
        <input type="text" placeholder="예: 3학년 1반">
      </div>
      <div class="info-field">
        <label>번호</label>
        <input type="number" placeholder="예: 7">
      </div>
      <div class="info-field">
        <label>이름</label>
        <input type="text" placeholder="홍길동">
      </div>
    </div>
  </div>

  <main class="main">
    
    <div class="hero">
      <span class="hero-emoji">🎵🎨</span>
      <h1 class="hero-title">노래를 <span>그리다</span></h1>
      <p class="hero-desc">감상한 음악을 떠올리며 마음에 일어나는 생각과 느낌을 정리해 보세요.</p>
    </div>

    <div class="step-card">
      <div class="step-header">
        <div class="step-badge s1">1</div>
        <div class="step-title-wrap">
          <div class="step-title">1단계: 노래 선택</div>
          <div class="step-sub">표현하고 싶은 노래의 제목과 가수를 입력합니다.</div>
        </div>
      </div>
      <div class="step-content">
        <div class="form-group">
          <label for="song-title">노래 제목</label>
          <input type="text" id="song-title" placeholder="듣고 있는 노래의 제목을 적어주세요">
        </div>
        <div class="form-group">
          <label for="song-artist">가수 / 아티스트</label>
          <input type="text" id="song-artist" placeholder="노래를 부른 가수의 이름을 적어주세요">
        </div>
      </div>
    </div>

    <div class="step-card">
      <div class="step-header">
        <div class="step-badge s2">2</div>
        <div class="step-title-wrap">
          <div class="step-title">2단계: 내용 작성</div>
          <div class="step-sub">노래를 들으며 떠오르는 생각이나 이미지를 글로 작성하고 제출합니다.</div>
        </div>
      </div>
      <div class="step-content">
        <div class="form-group">
          <label for="music-express">감상 내용 기록하기</label>
          <textarea id="music-express" placeholder="이 노래를 들을 때 어떤 장면, 색깔, 혹은 감정이 떠오르나요? 자유롭게 작성해 보세요."></textarea>
        </div>
        <button type="button" class="btn-submit" onclick="alert('교사에게 제출되었습니다!')">교사에게 제출하기</button>
      </div>
    </div>

  </main>

</body>
</html>
