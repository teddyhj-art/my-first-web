:root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#f0eff9;--surface3:#e4e3f0;--accent:#ff8906;--accent2:#e53170;--accent3:#3da9fc;--green:#2ec4b6;--purple:#a78bfa;--text:#0f0e17;--text-muted:#6e6d85;--border:rgba(0,0,0,0.08);--radius:16px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Noto Sans Thai','Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
/* HEADER */
.header{position:sticky;top:0;z-index:200;background:rgba(245,244,240,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{font-family:'Gowun Batang',serif;font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.lang-switcher{display:flex;gap:6px;flex-shrink:0}
.lang-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.78rem;cursor:pointer;transition:all .2s;font-family:inherit}
.lang-btn.active,.lang-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
/* STUDENT INFO */
.student-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px}
.student-bar-inner{max-width:900px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.info-field{flex:1;min-width:90px}
.info-field label{display:block;font-size:.7rem;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.info-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s}
.info-field input:focus{border-color:var(--accent)}
/* MAIN */
.main{max-width:900px;margin:0 auto;padding:28px 24px 80px;position:relative}
/* HERO */
.hero{text-align:center;padding:36px 0 28px}
.hero-emoji{font-size:3rem;display:block;margin-bottom:10px}
.hero-title{font-family:'Gowun Batang',serif;font-size:2rem;font-weight:700;line-height:1.3;margin-bottom:10px}
.hero-title span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-desc{color:var(--text-muted);font-size:.92rem;line-height:1.7;max-width:480px;margin:0 auto}
/* STEP CARD */
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;transition:box-shadow .3s}
.step-card:hover{box-shadow:0 6px 32px rgba(0,0,0,.4)}
.step-header{display:flex;align-items:center;gap:14px;padding:16px 22px;cursor:pointer;user-select:none;transition:background .2s}
.step-header:hover{background:var(--surface2)}
.step-card.open>.step-header{border-bottom:1px solid var(--border)}
.step-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0;color:#fff}

.s2{background:linear-gradient(135deg,#3da9fc,#6c63ff)}
.s3{background:linear-gradient(135deg,#2ec4b6,#3da9fc)}

.step-title{font-size:.98rem;font-weight:600;margin-bottom:2px}
